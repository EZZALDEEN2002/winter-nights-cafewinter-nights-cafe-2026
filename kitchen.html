<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المطبخ | ليالي الشتوية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #1f140c; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #f3e5ab; margin-bottom: 30px; border-bottom: 3px solid #d4af37; padding-bottom: 10px; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .order-card { background: #2c1d11; border: 2px solid #d4af37; border-radius: 12px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .order-card h3 { color: #f3e5ab; margin-bottom: 10px; border-bottom: 1px solid #4a3525; padding-bottom: 5px; }
        .order-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1.05rem; }
        .total { margin-top: 15px; font-weight: bold; color: #d4af37; font-size: 1.1rem; text-align: left; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
        .status-pending { background: #d97706; color: #fff; }
        .status-preparing { background: #2563eb; color: #fff; }
        .status-ready { background: #16a34a; color: #fff; }
    </style>
</head>
<body>

    <h1>👨‍🍳 لوحة طلبات المطبخ الحية - ليالي الشتوية</h1>
    <div id="ordersContainer" class="orders-grid">
        <p style="text-align: center; grid-column: 1 / -1; color: #bbb;">جاري البحث عن طلبات جديدة...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJYBzm8_Y9wgsgt_Njj80B17cki3fuqm4",
            authDomain: "winternightscafe.firebaseapp.com",
            projectId: "winternightscafe",
            storageBucket: "winternightscafe.appspot.com",
            messagingSenderId: "830675400484",
            appId: "1:830675400484:web:fd63fce86416cef41325b1",
            measurementId: "G-C4PHH0JLTB"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const ordersContainer = document.getElementById('ordersContainer');

        // جلب الطلبات النشطة (التي لم يتم إنهاء تسليمها) لحظياً
        db.collection("orders").where("status", "!=", "completed")
          .onSnapshot((snapshot) => {
              if (snapshot.empty) {
                  ordersContainer.innerHTML = `<p style="text-align: center; grid-column: 1 / -1; color: #bbb;">لا توجد طلبات جديدة حالياً</p>`;
                  return;
              }

              let html = '';
              snapshot.forEach((doc) => {
                  let order = doc.data();
                  let itemsHtml = '';
                  let orderId = doc.id;

                  order.items.forEach(i => {
                      itemsHtml += `<div class="order-item"><span>${i.name} (${i.quantity})</span> <span>${i.price * i.quantity} ر.س</span></div>`;
                  });

                  let badgeText = order.status === 'pending' ? 'بانتظار القبول' : (order.status === 'preparing' ? 'قيد التحضير' : 'جاهز للاستلام');
                  let badgeClass = order.status === 'pending' ? 'status-pending' : (order.status === 'preparing' ? 'status-preparing' : 'status-ready');

                  html += `
                      <div class="order-card">
                          <span class="status-badge ${badgeClass}">${badgeText}</span>
                          <h3>طلب # ${orderId.slice(-4)}</h3>
                          <div class="items-list">${itemsHtml}</div>
                          <div class="total">الإجمالي: ${order.totalPrice} ر.س</div>
                          
                          <!-- خانة الملاحظات أو سبب نفاذ الكمية -->
                          <input type="text" id="note-${orderId}" placeholder="سبب الاعتذار أو نفاذ الكمية (اختياري)..." style="width: 100%; padding: 8px; margin-top: 10px; border-radius: 6px; border: 1px solid #d4af37; background: #1f140c; color: #fff; outline:none;">

                          <div style="display: flex; gap: 5px; margin-top: 10px;">
                              <button onclick="updateStatus('${orderId}', 'preparing')" style="flex:1; background: #2563eb; color:#fff; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold;">تحضير</button>
                              <button onclick="updateStatus('${orderId}', 'ready')" style="flex:1; background: #16a34a; color:#fff; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold;">جاهز</button>
                              <button onclick="completeOrder('${orderId}')" style="flex:1; background: #d4af37; color:#1f140c; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold;">تسليم وإخفاء</button>
                          </div>
                          <button onclick="cancelWithNote('${orderId}')" style="background: #8b0000; color:#fff; border:none; width:100%; padding:8px; margin-top:8px; border-radius:6px; cursor:pointer; font-weight:bold;">اعتذار (نفذ الصنف)</button>
                      </div>
                  `;
              });
              ordersContainer.innerHTML = html;
          });

        // تحديث حالة الطلب (قيد التحضير أو جاهز)
        function updateStatus(orderId, newStatus) {
            db.collection("orders").doc(orderId).update({ status: newStatus });
        }

        // تسليم الطلب وإخفاؤه تماماً من شاشة المطبخ
        function completeOrder(orderId) {
            db.collection("orders").doc(orderId).update({ status: "completed" });
        }

        // إرسال تنبيه نفاذ الكمية للزبون وإلغاء الطلب
        function cancelWithNote(orderId) {
            const noteText = document.getElementById(`note-${orderId}`).value;
            db.collection("orders").doc(orderId).update({
                status: "cancelled",
                note: noteText || "عذراً، الصنف غير متوفر حالياً بسبب نفاذ الكمية."
            }).then(() => {
                alert("تم إرسال رسالة الاعتذار للزبون.");
            });
        }
    </script>
</body>
</html>
